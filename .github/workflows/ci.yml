name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # Required for GCP Workload Identity Federation

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mailmon
          POSTGRES_PASSWORD: mailmon
          POSTGRES_USER: mailmon
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mailmon -d mailmon"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://mailmon:mailmon@127.0.0.1:5432/mailmon

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format Check
        run: pnpm format:check

      - name: Test With Coverage
        run: pnpm test:coverage

      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: error

  build-and-deploy:
    name: Build & Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: us-central1
      ARTIFACT_REPO: mailmon-containers

    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          # Prefer Workload Identity Federation.
          # Create a provider and service account, then set these secrets.
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push API
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_NAME=@mailmon/api
            APP_PATH=api
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:latest

      - name: Build and Push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_NAME=@mailmon/worker
            APP_PATH=worker
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/worker:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/worker:latest

      - name: Setup Tofu
        uses: opentofu/setup-opentofu@v1

      - name: Tofu Init
        working-directory: infra
        run: tofu init

      - name: Validate Deploy Secrets
        env:
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN_ENCRYPTION_KEY: ${{ secrets.GMAIL_REFRESH_TOKEN_ENCRYPTION_KEY }}
        run: |
          test -n "$GMAIL_OAUTH_CLIENT_ID"
          test -n "$GMAIL_OAUTH_CLIENT_SECRET"
          test -n "$GMAIL_REFRESH_TOKEN_ENCRYPTION_KEY"

      - name: Tofu Bootstrap Deployer IAM
        working-directory: infra
        env:
          TF_VAR_gmail_oauth_client_id: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          TF_VAR_gmail_oauth_client_secret: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          TF_VAR_gmail_refresh_token_encryption_key: ${{ secrets.GMAIL_REFRESH_TOKEN_ENCRYPTION_KEY }}
        run: |
          tofu apply -auto-approve -input=false \
            -target=google_project_iam_member.deployer_pubsub_admin \
            -target=google_project_iam_member.deployer_cloud_tasks_queue_admin \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="github_repository=${{ github.repository }}" \
            -var="deployment_service_account_email=${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}" \
            -var="api_image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:${{ github.sha }}" \
            -var="worker_image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/worker:${{ github.sha }}" \
            -var="database_password=${{ secrets.DATABASE_PASSWORD }}" \
            -var="worker_base_url=${{ secrets.WORKER_BASE_URL }}"

      - name: Wait For Deployer IAM Propagation
        run: sleep 30

      - name: Tofu Apply
        working-directory: infra
        env:
          TF_VAR_gmail_oauth_client_id: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          TF_VAR_gmail_oauth_client_secret: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          TF_VAR_gmail_refresh_token_encryption_key: ${{ secrets.GMAIL_REFRESH_TOKEN_ENCRYPTION_KEY }}
        run: |
          tofu apply -auto-approve -input=false \
            -var="project_id=${{ env.GCP_PROJECT_ID }}" \
            -var="github_repository=${{ github.repository }}" \
            -var="deployment_service_account_email=${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}" \
            -var="api_image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/api:${{ github.sha }}" \
            -var="worker_image=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/worker:${{ github.sha }}" \
            -var="database_password=${{ secrets.DATABASE_PASSWORD }}" \
            -var="worker_base_url=${{ secrets.WORKER_BASE_URL }}"

      - name: Run Database Migrations
        run: |
          gcloud run jobs execute mailmon-migrations \
            --region ${{ env.GCP_REGION }} \
            --wait
