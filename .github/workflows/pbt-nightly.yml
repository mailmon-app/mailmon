name: PBT Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: pbt-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pbt:
    name: Hegel PBT
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mailmon
          POSTGRES_PASSWORD: mailmon
          POSTGRES_USER: mailmon
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mailmon -d mailmon"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://mailmon:mailmon@127.0.0.1:5432/mailmon
      PBT_TEST_CASES: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24

      - name: Cache Hegel uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/hegel
          key: ${{ runner.os }}-hegel-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-hegel-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build PBT Packages
        run: pnpm build:libs

      - name: Run Core and Gmail PBT
        env:
          PBT_INCLUDE: packages/core/src/**/*.pbt.test.ts,packages/gmail/src/**/*.pbt.test.ts
        run: |
          unset CI GITHUB_ACTIONS
          pnpm exec vitest run --config vitest.pbt.config.ts --reporter=verbose

      - name: Run DB Sync Commit PBT
        timeout-minutes: 6
        env:
          PBT_INCLUDE: packages/db/src/mailbox-sync-commit.pbt.test.ts
        run: |
          unset CI GITHUB_ACTIONS
          pnpm exec vitest run --config vitest.pbt.config.ts --reporter=verbose

      - name: Run DB Webhook and Replay PBT
        timeout-minutes: 6
        env:
          PBT_INCLUDE: packages/db/src/webhook-delivery-runtime.pbt.test.ts,packages/db/src/replay.pbt.test.ts
        run: |
          unset CI GITHUB_ACTIONS
          pnpm exec vitest run --config vitest.pbt.config.ts --reporter=verbose

      - name: Run DB Execution and Mapper PBT
        timeout-minutes: 6
        env:
          PBT_INCLUDE: packages/db/src/mailbox-sync-execution.pbt.test.ts,packages/db/src/persistence/pagination-cursors.pbt.test.ts,packages/db/src/persistence/canonical-state-mappers.pbt.test.ts
        run: |
          unset CI GITHUB_ACTIONS
          pnpm exec vitest run --config vitest.pbt.config.ts --reporter=verbose
