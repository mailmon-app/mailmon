name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push tags and create PRs
      pull-requests: write # To create PRs
      id-token: write # For NPM OIDC Publishing

    # We optionally tie this to the success of verify if you want, but it's okay to let it run.
    # We will let it run on main and rely on its own fast build.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Check versions
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # This runs `pnpm release` from root package.json if it decides to publish.
          # `pnpm release` will run the build steps and then `changeset publish`.
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: "unused" # Required by Changesets action to trigger publish, but NPM uses OIDC
          NPM_CONFIG_PROVENANCE: true
