workflowVersion: 1.0.0
speakeasyVersion: latest
sources:
  Mailmon API:
    inputs:
      - location: ../../apps/docs/api-reference/openapi.json
    overlays:
      - location: .speakeasy/speakeasy-modifications-overlay.yaml
    output: .speakeasy/out.openapi.yaml
    registry:
      location: registry.speakeasyapi.dev/mailmon/sdk/mailmon-api
targets:
  mailmon:
    target: typescript
    source: Mailmon API
    codeSamples:
      registry:
        location: registry.speakeasyapi.dev/mailmon/sdk/mailmon-api-typescript-code-samples
      labelOverride:
        fixedValue: Typescript (SDK)
      blocking: false
