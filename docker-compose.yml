services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: "@mailmon/api"
        APP_PATH: "apps/api"
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://mailmon:mailmon@postgres:5432/mailmon
      - MAILMON_ASYNC_TRANSPORT_MODE=local
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_NAME: "@mailmon/worker"
        APP_PATH: "apps/worker"
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://mailmon:mailmon@postgres:5432/mailmon
      - MAILMON_ASYNC_TRANSPORT_MODE=local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mailmon
      POSTGRES_USER: mailmon
      POSTGRES_PASSWORD: mailmon
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailmon -d mailmon"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
